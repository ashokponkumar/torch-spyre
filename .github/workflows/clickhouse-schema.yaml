name: clickhouse-schema

# Converges the v2 databases on extensions/clickhouse-ingest/schema/.
#   pull_request: apply to an empty throwaway server twice (the second must be a no-op).
#   push to main: apply to staging spyre_v2_next, then report what prod would change.
#   workflow_dispatch: apply to the chosen database -- the only path that changes prod.
on:
  pull_request:
    paths:
      - extensions/clickhouse-ingest/schema/**
      - extensions/clickhouse-ingest/spyre_clickhouse_ingest/apply_schema.py
      - .github/workflows/clickhouse-schema.yaml
  push:
    branches: [main]
    paths:
      - extensions/clickhouse-ingest/schema/**
      - extensions/clickhouse-ingest/spyre_clickhouse_ingest/apply_schema.py
  workflow_dispatch:
    inputs:
      database:
        description: Database to apply to
        type: choice
        options: [spyre_v2_next, spyre_v2]
        default: spyre_v2_next

concurrency:
  # DDL against one server must not interleave; PRs use their own throwaway server.
  group: clickhouse-schema-${{ github.event_name == 'pull_request' && github.run_id || 'live' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fresh:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        # Match prod's major.minor: the formatter output the drift check compares is versioned.
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_SKIP_USER_SETUP: '1'
        ports: [8123:8123]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Unit tests
        working-directory: extensions/clickhouse-ingest
        run: uv run --with pytest python -m pytest -q tests
      - name: Apply to an empty database, then prove it converged
        working-directory: extensions/clickhouse-ingest
        # Scoped to this step: the unit tests assert on these variables being unset.
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: '8123'
          CLICKHOUSE_SECURE: '0'
          CLICKHOUSE_DB: default
        run: |
          set -euo pipefail
          curl -sf localhost:8123 --data-binary 'CREATE DATABASE v2'
          uv run python -m spyre_clickhouse_ingest.apply_schema --database v2
          uv run python -m spyre_clickhouse_ingest.apply_schema --database v2 --check

  live:
    if: github.event_name != 'pull_request' && github.repository == 'torch-spyre/torch-spyre'
    runs-on:
      - x86_64
      - linux
      - image_ingest
    timeout-minutes: 30
    env:
      CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
      CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
      CLICKHOUSE_USER: ${{ secrets.CLICKHOUSE_USER }}
      CLICKHOUSE_PASS: ${{ secrets.CLICKHOUSE_PASS }}
      CLICKHOUSE_DB: ${{ secrets.CLICKHOUSE_DB }}
      TARGET: ${{ inputs.database || 'spyre_v2_next' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Apply to ${{ env.TARGET }}
        working-directory: extensions/clickhouse-ingest
        run: |
          set -euo pipefail
          uv run python -m spyre_clickhouse_ingest.apply_schema --database "$TARGET" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report what prod would change
        if: env.TARGET != 'spyre_v2'
        working-directory: extensions/clickhouse-ingest
        run: |
          set -uo pipefail
          {
            echo '### Pending on prod spyre_v2 (apply via workflow_dispatch)'
            echo '```'
            uv run python -m spyre_clickhouse_ingest.apply_schema --database spyre_v2 --check
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
