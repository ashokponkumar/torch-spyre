name: PyTorch Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytorch-tests:
    runs-on: ashok-test-org-aiu-x86-64-arc-runner-set
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run PyTorch tests
        run: |
          pytest tests/ -v
